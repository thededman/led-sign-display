<g font-size="14" font-weight="600" fill="#2C2C2A"><text x="412" y="75">Pin 2 · 5V → VCC</text><text x="412" y="123">Pin 6 · GND → GND</text><text x="412" y="255">Pin 19 · GPIO10 → DIN</text><text x="412" y="303">Pin 23 · GPIO11 → CLK</text><text x="412" y="351">Pin 24 · GPIO8 → CS</text></g>
<g font-size="12" fill="#5F5E5A"><text x="412" y="414">Rows count down from the SD card:</text><text x="412" y="434">row 1 = pins 1 and 2, row 2 = 3 and 4 …</text><text x="412" y="454">Odd pins: inner row. Even pins: board edge.</text></g>
</svg>
