<path d="M310 70 H306 V97 H146" fill="none" stroke="#888780" stroke-width="0.8" stroke-dasharray="3 3"/><text x="142" y="101" text-anchor="end" font-size="12" fill="#5F5E5A">Pin 1 (3.3V, not used)</text>
