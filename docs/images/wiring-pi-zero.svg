<svg xmlns="http://www.w3.org/2000/svg" width="680" height="600" viewBox="0 0 680 600" role="img" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
<title>Wiring the LED sign to a Raspberry Pi Zero</title>
<desc>Top view of a Pi Zero with the SD card at the top and the 40-pin header down the right edge. Pin 1 is the inner pin nearest the SD card. The display connects to pin 2 (5V, VCC), pin 6 (GND), pin 19 (GPIO10, DIN), pin 23 (GPIO11, CLK) and pin 24 (GPIO8, CS).</desc>
<rect width="680" height="600" rx="12" fill="#ffffff"/>
<rect x="150" y="40" width="230" height="520" rx="12" fill="#EAF3DE" stroke="#3B6D11" stroke-width="0.8"/>
<g fill="#D3D1C7" stroke="#888780" stroke-width="0.8"><rect x="230" y="40" width="70" height="44" rx="4"/><rect x="150" y="110" width="52" height="74" rx="4"/><rect x="150" y="380" width="52" height="56" rx="4"/><rect x="150" y="456" width="52" height="56" rx="4"/></g>
<g font-size="12" fill="#444441" text-anchor="middle"><text x="265" y="66">SD card</text><text x="176" y="151">HDMI</text><text x="176" y="412">USB</text><text x="176" y="488">PWR</text><text x="324" y="578">inner · edge</text></g>
<g fill="#B4B2A9">
