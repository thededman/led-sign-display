<svg xmlns="http://www.w3.org/2000/svg" width="680" height="430" viewBox="0 0 680 430" role="img" font-family="-apple-system, system-ui, 'Segoe UI', Roboto, sans-serif">
<title>Wiring the LED sign to an Arduino UNO</title>
<desc>Five wires from the display's IN header to the UNO: VCC to 5V on the bottom power header, GND to the GND beside pin 13, DIN to pin 11, CS to pin 10 and CLK to pin 13.</desc>
<rect width="680" height="430" rx="12" fill="#ffffff"/>
<rect x="160" y="28" width="300" height="72" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.8"/>
<text x="310" y="48" text-anchor="middle" font-size="14" font-weight="600" fill="#712B13">Display IN header (first module)</text>
<g font-size="12" fill="#712B13" text-anchor="middle"><text x="200" y="74">VCC</text><text x="250" y="74">GND</text><text x="300" y="74">DIN</text><text x="350" y="74">CS</text><text x="400" y="74">CLK</text></g>
<rect x="195" y="83" width="10" height="10" fill="#E24B4A"/><rect x="245" y="83" width="10" height="10" fill="#5F5E5A"/><rect x="295" y="83" width="10" height="10" fill="#1D9E75"/><rect x="345" y="83" width="10" height="10" fill="#7F77DD"/><rect x="395" y="83" width="10" height="10" fill="#BA7517"/>
<rect x="100" y="150" width="500" height="230" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.8"/>
<rect x="72" y="175" width="48" height="44" rx="4" fill="#D3D1C7" stroke="#888780" stroke-width="0.8"/><text x="96" y="201" text-anchor="middle" font-size="12" fill="#444441">USB</text>
<text x="350" y="266" text-anchor="middle" font-size="14" font-weight="600" fill="#2C2C2A">Arduino UNO (top view)</text>
<g fill="#B4B2A9"><rect x="245" y="157" width="10" height="10"/><rect x="335" y="157" width="10" height="10"/><rect x="425" y="157" width="10" height="10"/><rect x="455" y="157" width="10" height="10"/><rect x="487" y="157" width="10" height="10"/><rect x="501" y="157" width="10" height="10"/><rect x="515" y="157" width="10" height="10"/><rect x="529" y="157" width="10" height="10"/><rect x="543" y="157" width="10" height="10"/><rect x="557" y="157" width="10" height="10"/><rect x="571" y="157" width="10" height="10"/><rect x="585" y="157" width="10" height="10"/>
<rect x="225" y="363" width="10" height="10"/><rect x="267" y="363" width="10" height="10"/><rect x="309" y="363" width="10" height="10"/><rect x="393" y="363" width="10" height="10"/><rect x="435" y="363" width="10" height="10"/><rect x="477" y="363" width="10" height="10"/><rect x="519" y="363" width="10" height="10"/><rect x="533" y="363" width="10" height="10"/><rect x="547" y="363" width="10" height="10"/><rect x="561" y="363" width="10" height="10"/><rect x="575" y="363" width="10" height="10"/></g>
<rect x="275" y="157" width="10" height="10" fill="#5F5E5A"/><rect x="305" y="157" width="10" height="10" fill="#BA7517"/><rect x="365" y="157" width="10" height="10" fill="#1D9E75"/><rect x="395" y="157" width="10" height="10" fill="#7F77DD"/><rect x="351" y="363" width="10" height="10" fill="#E24B4A"/>
<g font-size="12" fill="#5F5E5A" text-anchor="middle"><text x="250" y="190">AREF</text><text x="340" y="190">12</text><text x="430" y="190">9</text><text x="460" y="190">8</text><text x="541" y="190">7 … 0</text>
<text x="230" y="348">IOREF</text><text x="272" y="348">RESET</text><text x="314" y="348">3.3V</text><text x="398" y="348">GND</text><text x="440" y="348">GND</text><text x="482" y="348">VIN</text><text x="554" y="348">A0 … A5</text></g>
<g font-size="13" font-weight="600" fill="#2C2C2A" text-anchor="middle"><text x="280" y="190">GND</text><text x="310" y="190">13</text><text x="370" y="190">11</text><text x="400" y="190">10</text><text x="356" y="348">5V</text></g>
<g fill="none" stroke-width="2"><path d="M250 93 V128 H280 V157" stroke="#5F5E5A"/><path d="M300 93 V138 H370 V157" stroke="#1D9E75"/><path d="M350 93 V118 H400 V157" stroke="#7F77DD"/><path d="M400 93 V108 H310 V157" stroke="#BA7517"/><path d="M200 93 V118 H56 V402 H356 V373" stroke="#E24B4A"/></g>
</svg>
