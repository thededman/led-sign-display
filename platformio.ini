; LED sign: 8 MAX7219 8x8 modules in a row (64x8)
;
;   pio run -t upload                   show on the Arduino UNO
;   pio run -e uno-wiring -t upload     wiring test: which pin is which
;   pio run -e uno-finder -t upload     orientation finder: how the modules are wired
;   pio run -e esp32 -t upload          show on an ESP32 DevKit V1 (needs a 3.3 V -> 5 V level shifter)

[platformio]
default_envs = uno

[env]
framework = arduino
monitor_speed = 115200

[env:uno]
platform = atmelavr
board = uno

[env:uno-finder]
platform = atmelavr
board = uno
build_flags = -D FINDER

[env:uno-wiring]
platform = atmelavr
board = uno
build_flags = -D WIRING_TEST

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1

[env:esp32]
platform = ${esp32.platform}
board = ${esp32.board}

[env:esp32-finder]
platform = ${esp32.platform}
board = ${esp32.board}
build_flags = -D FINDER
