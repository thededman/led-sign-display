; Halloween LED sign: 8 SainSmart MAX7219 8x8 modules in a row (64x8)
;
;   pio run -t upload               show on the ESP32 DevKit V1
;   pio run -e finder -t upload     orientation finder (pick the layout number)
;   pio run -e uno -t upload        show on an Arduino UNO (fallback)

[platformio]
default_envs = esp32

[env]
framework = arduino
monitor_speed = 115200

[esp32]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32doit-devkit-v1

[env:esp32]
platform = ${esp32.platform}
board = ${esp32.board}

[env:finder]
platform = ${esp32.platform}
board = ${esp32.board}
build_flags = -D FINDER

[env:uno]
platform = atmelavr
board = uno
